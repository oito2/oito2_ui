<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Every resource comes from this site: the engine is built without the
    web resources CDN and the fonts are bundled. WebAssembly needs
    'wasm-unsafe-eval', and the engine adds inline styles. GitHub Pages
    can't send headers, so frame-ancestors and the other header-only
    protections aren't available.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="description" content="Interactive showcase of oito2_ui, a Material 3 design system for Flutter apps on Linux, Windows, macOS, iOS, Android and the web.">
  <link rel="canonical" href="https://oito2.github.io/oito2_ui/">
  <meta property="og:title" content="oito2_ui showcase">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://oito2.github.io/oito2_ui/">
  <meta property="og:description" content="Interactive showcase of oito2_ui, a Material 3 design system for Flutter apps on Linux, Windows, macOS, iOS, Android and the web.">
  <meta property="og:locale" content="en_US">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="oito2_ui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>oito2_ui showcase</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <noscript>The oito2_ui showcase is a Flutter web app and needs JavaScript enabled.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
