name: oito2_ui_example
description: "Interactive showcase for the oito2_ui design system."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  oito2_ui: ^0.1.0
  oito2_ui_settings: ^0.1.0
  oito2_ui_syntax: ^0.1.0
  oito2_ui_themes: ^0.1.0
  oito2_ui_window: ^0.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # The page sources, shown by the "View source" action.
    - lib/src/pages/
