name: oito2_ui_code_editor
description: "Code editor for oito2_ui: an editable code field built on re_editor, colored with the oito2 syntax palette, with line numbers, highlighted lines and line markers."
version: 0.1.0
homepage: https://oito2.github.io/oito2_ui/
repository: https://github.com/oito2/oito2_ui/tree/main/packages/oito2_ui_code_editor
issue_tracker: https://github.com/oito2/oito2_ui/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  oito2_ui: ^0.1.0
  oito2_ui_syntax: ^0.1.0
  re_editor: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  oito2_ui_test_utils: any
