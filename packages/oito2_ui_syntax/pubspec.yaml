    sdk: flutter
  lucide_icons_flutter: ^4.0.0
  material_ui: ^1.7.0
  oito2_ui: ^0.1.0
  re_highlight: ^0.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
