name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC: run against the latest Flutter stable.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Runs of different events don't cancel each other, and only pull request
# runs give way to a newer push to the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Flutter release for push and pull request runs.
  FLUTTER_VERSION: 3.50.1

jobs:
  checks:
    name: Format and analyze
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: Documentation data is up to date
        run: dart run tool/generate_docs.dart --check
      - name: Regenerate the parity fixtures
        working-directory: tools/parity
        run: flutter test
      - name: Parity fixtures are up to date
        run: |
          git status --porcelain -- tools/parity/fixtures
          git diff --exit-code --stat -- tools/parity/fixtures
          if [ -n "$(git status --porcelain -- tools/parity/fixtures)" ]; then
            echo "The parity fixtures are stale: run 'flutter test' in tools/parity and commit the result." >&2
            exit 1
          fi

  test:
    name: Test ${{ matrix.package }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every package reports its result, even when another one fails.
      fail-fast: false
      matrix:
        package:
          - packages/oito2_ui
          - packages/oito2_ui_window
          - packages/oito2_ui_settings
          - packages/oito2_ui_syntax
          - packages/oito2_ui_code_editor
          - packages/oito2_ui_themes
          - packages/oito2_ui_extras
          - packages/oito2_ui_files
          - packages/oito2_ui_test_utils
          - example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test
      # Runners use UTC, which has no daylight saving time; date code is
      # also checked in zones that shift their clocks.
      - name: Test dates in other time zones
        if: matrix.package == 'packages/oito2_ui'
        working-directory: packages/oito2_ui
        run: |
          for tz in Europe/Berlin America/New_York; do
            echo "::group::TZ=$tz"
            TZ=$tz flutter test test/widgets/pickers_test.dart \
                                test/widgets/inputs_test.dart
            echo "::endgroup::"
          done
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ strategy.job-index }}
          path: ${{ matrix.package }}/test/goldens/failures/
          if-no-files-found: ignore

  build-ubuntu:
    name: Build web, Linux and Android
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The same build as the published showcase: engine and fonts served
      # from the site itself, under the GitHub Pages project path.
      - name: Build web
        working-directory: example
        run: flutter build web --release --no-web-resources-cdn --base-href /oito2_ui/
      - name: Check the web build
        run: dart run tool/check_web_build.dart example/build/web /oito2_ui/
      - name: Cache the HTML validator
        id: vnu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vnu
          key: vnu-jar-26.10.2
      - name: Install the HTML validator
        if: steps.vnu-cache.outputs.cache-hit != 'true'
        run: npm install --no-save --prefix ~/.cache/vnu vnu-jar@26.10.2
      - name: Validate the web HTML
        run: |
          java -jar ~/.cache/vnu/node_modules/vnu-jar/build/dist/vnu.jar \
            --skip-non-html --errors-only example/build/web
      - name: Build Linux
        working-directory: example
        run: flutter build linux --debug
      # The NDK version Flutter's Gradle plugin asks for (flutter.ndkVersion).
      # It is cached and installed ahead of Gradle with retries, because the
      # runner image doesn't ship it and a download sometimes arrives broken.
      - name: Locate the Android NDK
        run: |
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Cache the Android NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_NDK_DIR }}
          key: android-ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}
      - name: Install the Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            status=0
            yes | "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" >/dev/null \
              || status=${PIPESTATUS[1]}
            if [ "$status" -eq 0 ] && [ -f "$ANDROID_NDK_DIR/source.properties" ]; then
              exit 0
            fi
            echo "NDK install attempt $attempt failed; retrying."
            rm -rf "$ANDROID_NDK_DIR"
            sleep 15
          done
          exit 1
      # Gradle's downloaded dependencies and wrapper distribution, so the
      # Android build doesn't fetch them from Maven Central on every run.
      # Only downloads are kept, not the transforms Gradle builds locally,
      # to stay small. The key follows the Flutter version (its Gradle
      # plugin pins the Android Gradle and Kotlin versions) and the
      # example's Gradle files; an older cache is restored as a starting
      # point when they change.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            gradle-${{ runner.os }}-
      - name: Build Android
        working-directory: example
        # No daemon is left running, so the Gradle cache is saved from
        # files that no longer change.
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: flutter build apk --debug

  build-macos:
    name: Build macOS and iOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        working-directory: example
        run: flutter build macos --debug
      - name: Build iOS (no code signing)
        working-directory: example
        run: flutter build ios --debug --no-codesign

  build-windows:
    name: Build Windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows
        working-directory: example
        run: flutter build windows --debug

  latest-stable:
    name: Latest stable, ${{ matrix.package }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/oito2_ui
          - packages/oito2_ui_window
          - packages/oito2_ui_settings
          - packages/oito2_ui_syntax
          - packages/oito2_ui_code_editor
          - packages/oito2_ui_themes
          - packages/oito2_ui_extras
          - packages/oito2_ui_files
          - packages/oito2_ui_test_utils
          - example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not cached: the job runs once a week, and a cache of the newest
      # SDK would take space from the caches every push uses.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: false
      - run: flutter --version
      - name: Resolve the newest allowed dependencies
        run: flutter pub upgrade
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze
      # Goldens are pinned to the Flutter release above; a newer engine
      # may rasterize differently, so this job skips them.
      - name: Test except goldens
        working-directory: ${{ matrix.package }}
        run: flutter test --exclude-tags golden
