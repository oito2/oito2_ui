version: 2
updates:
  # Keeps the SHA-pinned actions current; the version comments follow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Keeps the pub dependencies of the whole workspace current: the entry at
  # the workspace root updates a dependency in every package that uses it,
  # and each week's updates arrive together in one pull request.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns:
          - "*"
